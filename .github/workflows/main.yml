name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: stage
        type: choice
        options:
          - stage
          - prod

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'stage' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'stage' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'stage' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run: pnpm test:coverage
      - name: Report test coverage
        if: always() && hashFiles('coverage/cobertura-coverage.xml') != ''
        run: |
         node --input-type=module <<'EOF' >> "$GITHUB_STEP_SUMMARY"
         import { readFileSync } from "node:fs";

         const report = readFileSync("coverage/cobertura-coverage.xml", "utf8");
         const match = report.match(/<coverage\s+([^>]*)>/);
         if (!match) {
           throw new Error("Cobertura coverage element was not found.");
         }

         const attributes = Object.fromEntries(
           [...match[1].matchAll(/([\w-]+)="([^"]*)"/g)].map(([, name, value]) => [name, value]),
         );
         const coverage = (covered, valid, rate) => `${(Number(rate) * 100).toFixed(2)}% (${covered}/${valid})`;

         console.log("## Test coverage");
         console.log("");
         console.log("| Lines | Branches |");
         console.log("| --- | --- |");
         console.log(`| ${coverage(attributes["lines-covered"], attributes["lines-valid"], attributes["line-rate"])} | ${coverage(attributes["branches-covered"], attributes["branches-valid"], attributes["branch-rate"])} |`);
         EOF
      - name: Upload coverage report
        if: always() && hashFiles('coverage/cobertura-coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
         name: coverage-report
         path: coverage/cobertura-coverage.xml
         if-no-files-found: error
      - name: Deploy private Blob Worker
        run: pnpm exec wrangler deploy --config src/blob-worker/wrangler.jsonc --env "$DEPLOY_ENVIRONMENT"
      - name: Deploy public API Worker
        run: pnpm exec wrangler deploy --config src/range-worker/wrangler.jsonc --env "$DEPLOY_ENVIRONMENT"
